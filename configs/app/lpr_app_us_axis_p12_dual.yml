#
# Dual Axis P12 IP camera configuration
#   source_0: AXIS P1214-E  @ 169.254.42.55
#   source_1: AXIS P12/M20  @ 169.254.42.56

alpr-runtime:
  profile: axis-stable
  low-latency-rtsp: 0
  rtsp-latency-ms: 200
  rtsp-drop-on-latency: 0
  rtsp-transport: tcp
  latency-metrics: 1

source-list:
  list: rtsp://alpr:alpr@169.254.42.56/axis-media/media.amp?videocodec=h264&resolution=1280x720&fps=15

analytics:
  enable: 1
  config-file: config_nvdsanalytics.txt

output:
  ## 1:file output  2:fake output  3:eglsink output
  type: 2
  ## 0: H264 encoder  1:H265 encoder
  enc: 0
  ## encoder type 0=Hardware 1=Software
  enc-type: 0
  bitrate: 4000000
  ##The file name without suffix
  filename: test

primary-gie:
  plugin-type: 0
  config-file-path: ../nvinfer/trafficcamnet_tao/pgie_trafficcamnet_config.txt
  unique-id: 1

secondary-gie0:
  plugin-type: 0
  config-file-path: ../nvinfer/LPD_us_tao/sgie_lpd_DetectNet2_us.txt
  unique-id: 2
  process-mode: 2

secondary-gie1:
  plugin-type: 0
  config-file-path: ../nvinfer/lpr_us_tao/sgie_lpr_us_config.txt
  unique-id: 3
  process-mode: 2

# Vehicle attribute classifiers are intentionally disabled for patrol mode.
# They add SGIE latency and have not been accurate enough yet for field use.
# Re-enable these sections later when make/type/color models are retuned.
#
# secondary-gie3:
#   plugin-type: 0
#   config-file-path: ../nvinfer/vehicletypenet_tao/sgie_vehicletypenet_config.txt
#   unique-id: 5
#   process-mode: 2
#
# secondary-gie4:
#   plugin-type: 0
#   config-file-path: ../nvinfer/vehiclemakenet_tao/sgie_vehiclemakenet_config.txt
#   unique-id: 6
#   process-mode: 2

tracker:
  tracker-width: 640
  tracker-height: 384
  gpu-id: 0
  ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
  ll-config-file: /opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_IOU.yml

live-dashboard:
  endpoint: http://127.0.0.1:8080/api/live-event
  source-map:
    source_0: cam1-P12M20
